<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamification Hub – Card Table (makieta klikalna)</title>
<style>/*CSS*/</style>
</head>
<body>
<div class="tb" role="toolbar" aria-label="Mockup controls" lang="en">
  <span class="tb-title">Gamification Hub · Card Table</span>
  <span class="tb-lbl">Persona</span>
  <div class="seg" id="tb-persona"><button data-p="out">Logged out</button><button data-p="student">Student</button><button data-p="teacher">Teacher</button></div>
  <span class="tb-lbl">Screen</span>
  <select class="tb-sel" id="tb-screen" aria-label="Screen"></select>
  <span class="tb-lbl">Theme</span>
  <div class="seg" id="tb-theme"><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
  <span class="tb-lbl">Frame</span>
  <div class="seg" id="tb-frame"><button data-f="desktop">Desktop</button><button data-f="mobile">Mobile</button></div>
  <button class="tb-act" id="tb-qr">Pending QR join: off</button>
  <button class="tb-act" id="tb-offline">Server error</button>
  <button class="tb-act" id="tb-reset">Reset data</button>
  <span class="tb-scale" id="tb-scale"></span>
  <span class="tb-hint" id="tb-hint" role="status"></span>
</div>
<div class="stage" id="stage"><div class="device" id="device"><div class="app" id="app" data-theme="light"></div></div></div>
<script>/*JS*/</script>
</body>
</html>
