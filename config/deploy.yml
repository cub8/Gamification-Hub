service: gamification_hub
image: cub8/gamification_hub

ssh:
  user: gamification-hub
  keys:
    - ~/.ssh/id_gamification_hub

proxy:
  ssl: false
  host: gamificationhub.projektstudencki.pl
  forward_headers: true
  buffering:
    requests: true
    max_request_body: 30_000_000 # 30 MB in bytes
    memory: 2_000_000 # 2MB kept in RAM while uploading data to disk

servers:
  web:
    hosts:
      - gamificationhub.vm.wmi.amu.edu.pl
  job:
    hosts:
      - gamificationhub.vm.wmi.amu.edu.pl
    cmd: bin/jobs

registry:
  username: cub8
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - GAMIFICATION_HUB_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: false

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "/opt/gamification-hub/storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18.4-alpine
    host: gamificationhub.vm.wmi.amu.edu.pl
    port: "127.0.0.1:5432:5432"
    env:
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /opt/postgres:/var/lib/postgresql
