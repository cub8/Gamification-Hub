      created: "Created the template “%{name}”."
      updated: "Saved the template. New sheets will get these categories."
      destroyed: "Deleted the template “%{name}”. Sheets created from it stay."
    # The first category a new template starts with.
    default_category: "Attendance"

    new:
      page_title: "New sheet template"

    edit:
      page_title: "Edit template %{name}"

    confirm_destroy:
