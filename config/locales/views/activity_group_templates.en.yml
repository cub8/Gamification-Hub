      models:
        activity_group_template:
          attributes:
            base_name:
              blank: "Enter the template name."
            base:
              no_category: "Add at least one visible category."
        # RewardCategory — a category of a template.
        activity_group_template_category:
          attributes:
            didactic_description:
              blank: "Say what the reward is for."
            reward:
              too_low: "The reward must be at least 1."
